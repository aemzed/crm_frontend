name: Deploy frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cat > /home/crm/crm_frontend/.env <<'ENVEOF'
            VITE_API_URL=https://crm-be.zonakasir.com
            ENVEOF
            cd /home/crm/crm_frontend
            # Deploy target only — always mirror origin/main exactly rather than
            # merging, so drift on the server (e.g. an old manual `npm install`
            # rewriting package-lock.json) never blocks a deploy.
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
